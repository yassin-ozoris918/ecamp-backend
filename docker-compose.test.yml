version: '3.8'
services:
  lms-postgres-test:
    image: postgres:15-alpine
    container_name: lms-postgres-test
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: lmstestdb
    ports:
      - "5433:5432"
    volumes:
      - lms-postgres-test-data:/var/lib/postgresql/data
volumes:
  lms-postgres-test-data:
